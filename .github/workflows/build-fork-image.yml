name: Build fork image (GHCR)

# Builds the full Twenty image (server + frontend) from this fork and pushes it
# to GitHub Container Registry at ghcr.io/<owner>/twenty. The production compose
# in deploy/ pulls this image, so the self-hosted instance runs the fork's
# features (won/lost, deal aging, probability/forecast, lost reasons, pipeline
# analysis) instead of upstream Twenty.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/build-fork-image.yml'
  workflow_dispatch:

concurrency:
  group: build-fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/twenty
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Twenty validates APP_VERSION as semver at startup, so it must be a
          # valid version string (not a label like "fork").
          build-args: |
            APP_VERSION=1.0.0
          # The frontend build is memory-heavy; GitHub-hosted ubuntu runners
          # have enough RAM. GHA layer cache keeps rebuilds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
