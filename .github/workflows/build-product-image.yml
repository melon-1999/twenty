name: Build product image (GHCR)

# Builds the twenty-docker "twenty" target (server + frontend) from
# product/rebrand and pushes it to ghcr.io/<owner>/novi-crm. Mirrors the
# legacy fork image workflow (custom-crm-v1-2026-09), retargeted at the
# product branch and image name.

on:
  push:
    branches: [product/rebrand]
    paths:
      - 'packages/**'
      - '.github/workflows/build-product-image.yml'
  workflow_dispatch:

concurrency:
  group: build-product-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read APP_VERSION from PRODUCT_VERSION
        id: app_version
        run: |
          VERSION=$(sed -n "s/^export const PRODUCT_VERSION = '\(.*\)';$/\1/p" packages/twenty-shared/src/constants/ProductVersion.ts)
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/novi-crm
          tags: |
            type=sha,format=short
            type=raw,value=product-rebrand

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
          # GHA layer cache keeps rebuilds fast; the frontend build is
          # memory-heavy, GitHub-hosted ubuntu runners have enough RAM.
          cache-from: type=gha
          cache-to: type=gha,mode=max
